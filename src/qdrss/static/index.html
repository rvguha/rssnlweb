<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rssnlweb</title>
<style>
  :root { --fg: #1a1a1a; --muted: #666; --line: #ddd; --bg: #fff; --accent: #0b5fff; --tag: #eef3ff; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #eee; --muted: #999; --line: #333; --bg: #111; --accent: #6ea0ff; --tag: #1d2a44; }
  }
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 720px; padding: 32px 16px; font: 16px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  form { display: grid; gap: 12px; }
  label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
  input, select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label.check { display: flex; align-items: center; gap: 8px; align-self: end; padding-bottom: 10px; color: var(--text, inherit); cursor: pointer; }
  label.check input { width: auto; margin: 0; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); }
  #url { margin-top: 24px; display: none; }
  #url code { display: block; padding: 10px; border: 1px solid var(--line); border-radius: 6px; word-break: break-all; font-size: 14px; }
  .actions { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .actions span { color: var(--muted); font-size: 14px; }
  #preview { margin-top: 32px; }
  #status { color: var(--muted); font-size: 14px; }
  .item { padding: 14px 0; border-top: 1px solid var(--line); }
  h3.earlier { margin: 24px 0 4px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .item a { color: var(--fg); font-weight: 600; text-decoration: none; }
  .item a:hover { text-decoration: underline; }
  .meta { font-size: 13px; color: var(--muted); margin: 2px 0 6px; }
  .tag { display: inline-block; padding: 0 6px; border-radius: 4px; background: var(--tag); color: var(--accent); font-size: 12px; margin-right: 6px; }
  .why { font-size: 14px; }
  .err { color: #c22; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  .tabs button { background: none; border: none; border-bottom: 2px solid transparent; border-radius: 0; color: var(--muted); padding: 8px 12px; margin-bottom: -1px; }
  .tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
  .tabs small { color: var(--muted); font-size: 12px; margin-left: 4px; }
  #examples { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 4px; }
  #examples button { background: var(--tag); color: var(--accent); border: 1px solid transparent; border-radius: 14px; padding: 4px 10px; font-size: 13px; line-height: 1.35; text-align: left; }
  #examples button:hover, #examples button:focus-visible { border-color: var(--accent); }
</style>
</head>
<body>
<h1>rssnlweb</h1>
<p class="sub">Type a query. Get an RSS feed of new items that match it.</p>

<div class="tabs" id="tabs" role="tablist"></div>

<form id="form">
  <label>Query
    <input id="q" name="q" placeholder="e.g. open-source database releases with benchmarks" required autofocus>
  </label>
  <div id="examples" aria-label="Example queries"></div>
  <div class="row">
    <label>Items per fetch
      <input id="limit" type="number" min="1" max="100" value="20">
    </label>
    <label class="check" title="Search every stored episode, not only what arrived this week">
      <input id="archive" type="checkbox" checked> Include archive
    </label>
  </div>
  <div><button type="submit">Create feed</button></div>
</form>

<div id="url">
  <label>Feed URL</label>
  <code id="urltext"></code>
  <div class="actions">
    <button type="button" class="ghost" id="copy">Copy</button>
    <a id="open" target="_blank" rel="noopener">Open raw XML</a>
    <span id="copied"></span>
  </div>
</div>

<div id="preview">
  <div id="status"></div>
  <div id="items"></div>
</div>

<script>
const form = document.getElementById('form');
const urlBox = document.getElementById('url');
const urlText = document.getElementById('urltext');
const openLink = document.getElementById('open');
const status = document.getElementById('status');
const items = document.getElementById('items');
const QD = 'https://qdrss.dev/ns';
const tabs = document.getElementById('tabs');
let collection = '';  // '' = every collection

const LABELS = { ai: 'AI', history: 'History', finance: 'Finance', international: 'International', cricket: 'Cricket', american_football: 'American football', soccer: 'Soccer', nonprofit: 'Nonprofits', war: 'War', nytimes: 'NYT', npr: 'NPR', tal: 'This American Life' };
// Example queries per collection; each returned several matches against the live corpus.
const EXAMPLES = {
  npr: ['The economics of housing, rent and the cost of living',
        'Immigration policy and the debate over deportations',
        'Artificial intelligence and the future of work',
        'The Supreme Court and its major rulings',
        'How climate change is reshaping cities and communities',
        'Personal stories about family, grief and growing up'],
  nytimes: ['The state of American democracy, elections and political polarization',
            'Investigative series about crime, injustice and wrongful convictions',
            'The best products to buy for your kitchen and home',
            'Climate change, extreme weather and energy policy',
            'Interviews with celebrities, actors and writers about their lives and work',
            "The war in Ukraine and Russia's strategy"],
  '': ['How AI is changing jobs, productivity and financial markets, with evidence rather than hype',
       "Historical parallels drawn to today's geopolitical crises and wars",
       'The business of sport: league finances, club ownership and media rights deals'],
  ai: ['Are scaling laws slowing down? Debates over compute, data limits and new training paradigms',
       'Reinforcement learning, reasoning models and test-time compute explained by researchers',
       'AI agents in production: failures, evaluation methods and cost trade-offs',
       'Open-weight model releases compared with frontier closed models on coding and reasoning',
       'AI regulation in the EU, US states and China and what it means for startups',
       'Alignment research agendas, loss-of-control risks and critiques of AI doom arguments',
       'Chip export controls, GPU supply and the energy economics of AI data centers',
       'AI in medicine: diagnostic accuracy, clinical trials and regulatory approval',
       'How AI coding assistants change software engineering jobs and developer productivity',
       "China's AI labs, models and industrial policy compared with the US"],
  history: ['Ancient Rome: emperors, civil wars and the decline of the Republic',
            'Revolutions compared: causes and outcomes of the French, Russian and Haitian revolutions',
            'Queens and powerful women in medieval and early modern Europe',
            'The July Crisis of 1914 and how diplomacy failed to stop World War One',
            'British Empire in India: the East India Company, the Raj and partition',
            'Ancient civilizations of Egypt, Greece and Persia: rulers, wars and religion',
            'Political scandals and corruption in American history',
            'Spies, codebreakers and intelligence operations in World War Two'],
  finance: ['Federal Reserve rate decisions, inflation data and how bond markets react',
            'Index funds versus active management: fees, factor evidence and performance',
            'Retirement portfolios: safe withdrawal rates, bonds and inflation protection',
            'Tariffs and trade policy effects on markets, supply chains and prices',
            'Housing affordability, mortgage rates and the outlook for home prices',
            'Stablecoins, crypto regulation and the failures of crypto exchanges',
            'How endowments, pensions and hedge funds allocate capital',
            'Recession signals: yield curve, unemployment and corporate earnings'],
  international: ['China-Taiwan tensions and US military posture in the Indo-Pacific',
                  "Russia's war in Ukraine: frontline developments, sanctions and peace talks",
                  'European elections and the rise of populist and far-right parties',
                  "India's foreign policy between the US, Russia and China",
                  'Israel, Gaza, Iran and regional diplomacy in the Middle East',
                  'Coups in the Sahel, resource deals and great-power competition in Africa',
                  'Trade wars and tariffs between the US, the EU and China',
                  'Climate negotiations, climate finance and developing countries'],
  cricket: ["England's attacking Bazball approach to Test cricket: tactics and results",
            'Spin bowling in subcontinent conditions and how visiting batters cope',
            'The future of Test cricket against franchise T20 leagues like the IPL',
            'County Championship pitches, player development and selection for England',
            'India versus Australia Test series analysis',
            "The growth of women's cricket: the WPL, the Hundred and international series",
            "Fast bowlers' injuries, workload management and pace attacks"],
  american_football: ['NFL quarterback film breakdowns, MVP races and contract extensions',
                      'Fantasy football waiver pickups and start or sit advice for running backs',
                      'NFL Draft scouting reports on quarterbacks and edge rushers',
                      'College football playoff expansion, conference realignment and NIL money',
                      'Defensive coordinators, pass rush and coverage schemes that stop elite quarterbacks',
                      'Offensive play-calling: Shanahan, McVay and the modern NFL run game',
                      'Head coach hirings and firings and front office roster decisions',
                      'Injury news and how it changes betting lines and fantasy value'],
  soccer: ['Premier League title race: how the top teams play and their key matchups',
           'Transfer window deals and rumours for the biggest European clubs',
           'Champions League knockout ties and European club competition',
           "Women's football: the WSL, the NWSL and the Women's Champions League",
           'Football finance: club ownership, profit and sustainability rules and breakaway leagues',
           'Managers under pressure and how clubs rebuild their squads',
           'Young talents and academy players breaking through at top European clubs'],
  nonprofit: ['Major gift fundraising: donor cultivation, the ask and stewardship',
              'Capital campaigns: feasibility studies, lead gifts and campaign planning',
              'Nonprofit board governance, recruiting board members and working with the executive director',
              'Grant writing and building relationships with foundations',
              'Burnout, staff retention and healthy culture in nonprofit teams',
              'Using AI and technology to run a small nonprofit',
              'Measuring impact and reporting outcomes to donors'],
  war: ['Drone warfare in Ukraine: FPV drones, electronic warfare and counter-drone defences',
        'Deterring China over Taiwan: naval power, logistics and the Indo-Pacific military balance',
        'Nuclear deterrence, arms control and the risk of escalation between great powers',
        'Rebuilding the defence industrial base: munitions production, shipbuilding and procurement',
        'AI, autonomy and the future of command and control on the battlefield',
        'What commanders learned from World War II campaigns that still shapes strategy today'],
};
const examples = document.getElementById('examples');

function showExamples(name) {
  examples.replaceChildren(...(EXAMPLES[name] || []).map(q => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = q;
    b.addEventListener('click', () => { document.getElementById('q').value = q; form.requestSubmit(); });
    return b;
  }));
}

function label(name) { return LABELS[name] || name.replace(/[-_]/g, ' '); }

async function loadTabs() {
  let cols = {};
  try { cols = await (await fetch('/collections')).json(); } catch (e) { return; }
  const names = Object.keys(cols);
  if (names.length < 2) { tabs.style.display = 'none'; return; }
  const entries = [['', 'All', names.reduce((n, k) => n + cols[k].items, 0)], ...names.map(n => [n, label(n), cols[n].items])];
  tabs.innerHTML = '';
  for (const [name, text, items] of entries) {
    const b = document.createElement('button');
    b.type = 'button'; b.role = 'tab'; b.dataset.collection = name;
    b.append(text);
    const s = document.createElement('small'); s.textContent = items.toLocaleString(); b.append(s);
    b.addEventListener('click', () => { selectTab(name); if (urlBox.style.display === 'block') form.requestSubmit(); });
    tabs.append(b);
  }
  selectTab(collection);
}

function selectTab(name) {
  collection = name;
  for (const b of tabs.querySelectorAll('button')) b.setAttribute('aria-selected', b.dataset.collection === name);
  showExamples(name);
}

const ARCHIVE_SINCE = '2000-01-01';

function feedUrl() {
  const p = new URLSearchParams();
  p.set('q', document.getElementById('q').value.trim());
  if (collection) p.set('collection', collection);
  const limit = parseInt(document.getElementById('limit').value, 10);
  if (limit && limit !== 20) p.set('limit', String(limit));
  // Feeds hold what was ingested within the window; archived episodes are stamped
  // with their publication date, so searching them means a far-back since.
  if (document.getElementById('archive').checked) p.set('since', ARCHIVE_SINCE);
  return `${location.origin}/feed.xml?${p}`;
}

function text(node, name) {
  const el = node.getElementsByTagName(name)[0];
  return el ? el.textContent : '';
}

function parse(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('feed is not valid XML');
  return Array.from(doc.getElementsByTagName('item'));
}

function render(list, heading) {
  if (heading) {
    const h = document.createElement('h3'); h.className = 'earlier'; h.textContent = heading;
    items.append(h);
  }
  for (const node of list) {
    const div = document.createElement('div');
    div.className = 'item';
    const a = document.createElement('a');
    a.href = text(node, 'link'); a.textContent = text(node, 'title'); a.target = '_blank'; a.rel = 'noopener';
    const meta = document.createElement('div'); meta.className = 'meta';
    const tag = document.createElement('span'); tag.className = 'tag';
    tag.textContent = node.getElementsByTagNameNS(QD, 'category')[0]?.textContent || '';
    meta.append(tag, `${text(node, 'source')} · ${text(node, 'pubDate')}`);
    const why = document.createElement('div'); why.className = 'why';
    why.textContent = text(node, 'description').split('\n')[0].replace(/^\[\w+\]\s*/, '');
    div.append(a, meta, why);
    items.append(div);
  }
}

// Below this many matches in the window, the preview also shows earlier ones.
// The feed only ever adds new items, so a niche topic can look empty on a quiet
// week (cricket's spin-bowling example: 0 this week, dozens in the archive).
const EARLIER_BELOW = 5;

async function fetchItems(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  return parse(await res.text());
}

async function preview(url) {
  status.textContent = 'Evaluating…'; items.innerHTML = '';
  try {
    const recent = await fetchItems(url);
    render(recent);
    const archived = document.getElementById('archive').checked;
    if (archived || recent.length >= EARLIER_BELOW) {
      status.textContent = recent.length
        ? `${recent.length} item${recent.length === 1 ? '' : 's'} match now`
        : 'No matching items. Subscribe anyway; new matches appear as they arrive.';
      return;
    }
    status.textContent = `${recent.length} new this week · looking for earlier matches…`;
    const all = new URL(url);
    all.searchParams.set('since', ARCHIVE_SINCE);
    const seen = new Set(recent.map(node => text(node, 'link')));
    const earlier = (await fetchItems(all)).filter(node => !seen.has(text(node, 'link')));
    if (earlier.length) render(earlier, 'Earlier episodes (not in the feed, which only adds new ones)');
    status.textContent = `${recent.length} new this week` +
      (earlier.length ? ` · ${earlier.length} earlier match${earlier.length === 1 ? '' : 'es'} below` : '') +
      '. Subscribe to get new matches as they arrive.';
  } catch (e) {
    status.innerHTML = `<span class="err">${e.message}</span>`;
  }
}

form.addEventListener('submit', (ev) => {
  ev.preventDefault();
  const url = feedUrl();
  urlText.textContent = url; openLink.href = url; urlBox.style.display = 'block';
  // The archive is on by default, so only turning it off goes in the link.
  const shared = new URL(url).searchParams;
  if (!document.getElementById('archive').checked) shared.set('archive', '0');
  history.replaceState(null, '', `?${shared}`);
  preview(url);
});

document.getElementById('copy').addEventListener('click', async () => {
  await navigator.clipboard.writeText(urlText.textContent);
  document.getElementById('copied').textContent = 'Copied';
  setTimeout(() => document.getElementById('copied').textContent = '', 1500);
});

// A shared link like /?q=... rebuilds the same feed.
const initial = new URLSearchParams(location.search);
collection = initial.get('collection') || '';
showExamples(collection);
loadTabs();
if (initial.get('q')) {
  document.getElementById('q').value = initial.get('q');
  if (initial.get('limit')) document.getElementById('limit').value = initial.get('limit');
  if (initial.get('archive') === '0') document.getElementById('archive').checked = false;
  form.requestSubmit();
}
</script>
</body>
</html>
