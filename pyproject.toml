[project]
name = "qdrss"
version = "0.1.0"
description = "Query Defined RSS: a natural-language query is a feed over a corpus of upstream feeds"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "aiohttp>=3.9,<4",
  "azure-cosmos>=4.9,<5",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "openai>=1.40,<3",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
  "starlette>=0.40,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[project.scripts]
qdrss = "qdrss.app:main"
qdrss-ingest = "qdrss.app:ingest_main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qdrss = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
